plugins {
    id 'com.android.library'
    id 'kotlin-android'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'

android {
    compileSdkVersion libsinfo.compileSdk
    namespace 'com.cboda.select.picture'
    defaultConfig {
        minSdk libsinfo.minSdk
//        targetSdk libsinfo.compileSdk
//        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }
}

ext {
    PUBLISH_ARTIFACT_ID = "pictureselector"
}

dependencies {
    implementation "${andx.appcompat}"
    implementation "${andx.recyclerview}"
    implementation "${andx.activity}"
    implementation "${andx.fragment}"
    implementation "${andx.exifinterface}"
    implementation "${andx.viewpager2}"
    implementation "${andx.constraintlayout}"
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'maven-publish'
apply from: '../config.gradle'
//apply plugin: 'de.undercouch.download'

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
//        targetSdkVersion 30

        consumerProguardFiles "consumer-rules.pro"
        //noinspection ChromeOsAbiSupport
//        ndk.abiFilters 'arm64-v8a', 'armeabi-v7a' //, 'x86', 'x86-64'
    }
    namespace 'com.cboda.agora.service'


    buildTypes {
        release {
            minifyEnabled true   //混淆
//            shrinkResources true  //资源缩减(删除无用资源)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}
ext {
    PUBLISH_ARTIFACT_ID = "imeetservice"
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Unit Test Libraries
//    testImplementation 'junit:junit:4.13.2'
    testImplementation "${thirdPartyApis.junit}"
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    // androidTestImplementation 'androidx.test.espresso:espressso-core:3.4.0'

    // Android Component Libraries
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.core:core-ktx:1.6.0'

    // Kotlin External Libraries
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'

    // Logging Libraries
    implementation 'com.orhanobut:logger:2.2.0'

    // Http Libraries
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    implementation 'com.github.mrmike:ok2curl:0.8.0'
    implementation 'com.google.code.gson:gson:2.9.0'

    // Image Loading Libraries
    implementation 'com.github.bumptech.glide:glide:4.15.0'
    kapt 'com.github.bumptech.glide:compiler:4.15.0'

    // Ui Libraries
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.AgoraIO-Community:LyricsView:1.1.1-beta.8'


    //agora rtc
//    api 'io.agora.rtc:agora-special-full:4.6.0.130'
//    api 'io.agora.rtc:full-sdk:4.5.0'
//    api 'io.agora.rtc:full-sdk:4.6.1'
//    api 'cn.shengwang.rtc:lite-sdk:4.6.1'
    api 'io.agora.rtc:lite-sdk:4.5.0'
    //agora chat
//    api 'cn.shengwang:chat-sdk:1.3.2'
    //agora chat
    api 'io.agora.rtc:chat-sdk:1.3.2'
//    implementation 'io.agora.rtc:full-sdk:4.5.0'
    api('io.agora:agora-rtm:2.2.2') {
        exclude group: 'io.agora', module: 'aosl'  // 排除 libaosl.so
    }
}

// Because the components are created only during the afterEvaluate phase, you must
// configure your publications using the afterEvaluate() lifecycle method.
afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'io.github.agoraio-community'
                artifactId = 'AUIKit-Service'
                version = '0.2.0'
            }
            // Creates a Maven publication called “debug”.
            debug(MavenPublication) {
                // Applies the component for the debug build variant.
                from components.debug

                groupId = 'io.github.agoraio-community'
                artifactId = 'AUIKit-Service'
                version = '0.2.0'
            }
        }
    }
}
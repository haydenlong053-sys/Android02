plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'
group = 'com.github.wildfirechat'

android {
    compileSdkVersion libsinfo.compileSdk
//    buildToolsVersion "33.0.3"
    namespace 'com.cboda.chat.client'

    defaultConfig {
        minSdk libsinfo.minSdk

        // testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
//        ndk {
//            // TODO: changes this for your application if needed
//            moduleName = "mmnet"
//            //abiFilter "armeabi" //去掉armeabi架构，armeabi-v7a可以兼容armeabi架构。
//            abiFilter "armeabi-v7a"
//            abiFilter "arm64-v8a"
//            abiFilter "x86"
//            abiFilter "x86_64"
//        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }

    lint {
        abortOnError false
    }
    buildFeatures {
        aidl true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}


dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    api "${thirdPartyApis.okhttp3}"
    api files('libs/broad-chat.aar')
//    api 'com.cboda:broad-chat:1.0.0'
    implementation project(':baselibrary')
    implementation "${thirdPartyApis.kotlinx_coroutines}"
    implementation "${thirdPartyApis.okio}"
    implementation "${andx.core}"
    implementation "${andx.lifecycle_viewmodel_ktx}"
    implementation "${andx.lifecycle_livedata_ktx}"
    implementation "${andx.lifecycle_process}"
}
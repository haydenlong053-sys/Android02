plugins {
    id 'com.android.library'
    id 'kotlin-android'

//    id 'maven-publish'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'
android {
    compileSdkVersion libsinfo.compileSdk
    namespace 'com.cboda.chatui'
    defaultConfig {
        minSdkVersion libsinfo.minSdk
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
//                includeCompileClasspath true
            }
        }
    }
//    buildTypes {
//        release {
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//        }
//        debug {
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//        }
//    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
//    kotlinOptions {
//        jvmTarget = '17'
//    }
    sourceSets {
        main {
            res.srcDirs += ['src/main/res-av']

            // moment start
//            java.srcDirs += ['../../android-momentkit/src/main/java']
//            res.srcDirs += ['../../android-momentkit/src/main/res-moment']
            // moment end
        }
    }
    productFlavors {
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
//    repositories {
//        flatDir {
//            dirs 'libs'
//        }
//    }
}

dependencies {
//    api 'com.cboda.joda:time:1.0.0'
//    api 'com.cboda.joda:timeSources:1.0.0'
//    api 'com.cboda.chat:emoji:1.0.0'
//    api 'com.cboda.chat:libwebrtc:1.0.0'
//    api 'com.cboda.chat:pinyin:1.0.0'
//    api 'com.cboda.chat:pttclient:1.0.0'
//    api 'com.cboda.chat:search:1.0.0'
//    api 'com.cboda.chat:vengin:1.0.0'
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    api files('libs/broad_chat_vengin.aar')
    api files('libs/broad_chat_pttclient.aar')
    api files('libs/broad_chat_libwebrtc.aar')
    api files('libs/broad_chat_emoji.aar')
    api project(':chat-client')
    api libs.androidx.appcompat
    api libs.material
    api libs.glide
    api libs.androidx.lifecycle.process
    api libs.flexbox
    api libs.afollestad.core
    api libs.king.zxing
    api libs.wheelpicker
    api libs.agora.meet
//    api libs.agora.screen.share
    implementation libs.androidx.swiperefreshlayout
    implementation libs.eventbus
    implementation libs.ucrop
    implementation libs.gson
    implementation libs.lqr.adapter.library
    implementation libs.statusbaruitl
    implementation libs.wheel.camera
    implementation libs.photoview
    implementation libs.androidx.gridlayout
    implementation libs.kvh.amr
    implementation libs.viewpagerdotsindicator
    coreLibraryDesugaring libs.desugar.jdk.libs
//    api project(':chat-emoji')
//    api files('libs/broad_chat_client.aar')
//    api project(':baselibrary')
//    api 'com.cboda.baselibrary:baseLibrary:1.0.0'
//    api 'com.tencent.mars:mars-sdt:2.0.3'
//    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
//    annotationProcessor 'androidx.annotation:annotation:1.7.0'
//    api "androidx.lifecycle:lifecycle-extensions:2.2.0"
//    api project(':imagepicker')
//    implementation 'io.github.lucksiege:pictureselector:v3.11.2'
//    implementation 'io.github.lucksiege:compress:v3.11.2'
//    implementation project(':momentclient')
//    implementation 'me.everything:overscroll-decor-android:1.0.4'
}



plugins {
    id 'com.android.library'
//    id 'maven-publish'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'
android {
    namespace 'com.cboda.videocompressor'
    compileSdkVersion libsinfo.compileSdk

    defaultConfig {
        minSdkVersion libsinfo.minSdk
//        targetSdk 36
//        versionCode 1
//        versionName "1.0"
//
//        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
//    implementation "com.cboda.video.compressor:isoparser:1.0.0"
//    implementation "com.cboda.video.compressor:aspectjrt:1.0.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/broad_isoparser-1.0.6.jar')
    implementation files('libs/broad_aspectjrt-1.7.3.jar')
    implementation "${andx.appcompat}"
//    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
//        exclude group: 'com.android.support', module: 'support-annotations'
//    })
//    testImplementation 'junit:junit:4.+'
}




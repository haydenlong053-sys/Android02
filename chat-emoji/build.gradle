plugins {
    id 'com.android.library'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'
android {
    compileSdkVersion libsinfo.compileSdk
    namespace 'com.cboda.chatemoji'

    defaultConfig {
        minSdkVersion libsinfo.minSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    android {
        lintOptions {
            abortOnError false
        }
    }


}

dependencies {
//    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "${andx.appcompat}"
    implementation "${thirdPartyApis.eventbus}"
    implementation "${thirdPartyApis.gson}"
    implementation "${thirdPartyApis.transformations}"
    implementation "${thirdPartyApis.glide}"
}
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
//    id 'maven-publish'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'
android {
    compileSdkVersion libsinfo.compileSdk
    namespace 'com.cboda.baselibrary'

    defaultConfig {
        buildConfigField "int", "APP_ENVIRONMENT", libsinfo.appEnvironment
        buildConfigField "boolean", "IS_NEW_SIGNATURE", libsinfo.isNewSignature
        minSdk libsinfo.minSdk
        targetSdk libsinfo.compileSdk
//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            buildConfigField "boolean", "IS_DEBUG", libsinfo.isDebug
            buildConfigField "boolean", "IS_REVIEW_ENV", libsinfo.isReviewEnv
//            minifyEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            buildConfigField "boolean", "IS_DEBUG", "true"
            buildConfigField "boolean", "IS_REVIEW_ENV", "false"
//            shrinkResources false // 临时关闭
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }


    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_21
        sourceCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        freeCompilerArgs += [
                '-Xskip-prerelease-check',
                '-Xno-param-assertions'
        ]
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}


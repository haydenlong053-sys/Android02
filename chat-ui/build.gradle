plugins {
    id 'com.android.library'
    id 'kotlin-android'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'
android {
    compileSdkVersion libsinfo.compileSdk
    namespace 'com.cboda.chatui'
    defaultConfig {
        minSdkVersion libsinfo.minSdk
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
//                includeCompileClasspath true
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main {
            res.srcDirs += ['src/main/res-av']

            // moment start
//            java.srcDirs += ['../../android-momentkit/src/main/java']
//            res.srcDirs += ['../../android-momentkit/src/main/res-moment']
            // moment end
        }
    }
    productFlavors {
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
//    repositories {
//        flatDir {
//            dirs 'libs'
//        }
//    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    api files('libs/broad_chat_vengin.aar')
    api files('libs/broad_chat_pttclient.aar')
    api files('libs/broad_chat_libwebrtc.aar')
//    api files('libs/broad_chat_client.aar')
    api files('libs/broad_chat_emoji.aar')
//    api project(':chat-emoji')
    api project(':chat-client')
    api project(':baselibrary')
    api "${andx.appcompat}"
    api "${thirdPartyApis.material}"
    api "${thirdPartyApis.glide}"
    api "${andx.lifecycle_process}"
    api "${thirdPartyApis.flexbox}"
    api "${thirdPartyApis.afollestad_core}"
    api "${thirdPartyApis.king_zxing}"
    api "${thirdPartyApis.WheelPicker}"
    implementation "${andx.swiperefreshlayout}"
    implementation "${thirdPartyApis.eventbus}"
    implementation "${thirdPartyApis.ucrop}"
    implementation "${thirdPartyApis.gson}"
    implementation "${thirdPartyApis.lqr_adapter_library}"
    implementation "${thirdPartyApis.statusbaruitl}"
    implementation "${thirdPartyApis.wheel_camera}"
    implementation "${thirdPartyApis.PhotoView}"
    implementation "${andx.gridlayout}"
    implementation "${thirdPartyApis.kvh_amr}"
    implementation "${thirdPartyApis.viewpagerdotsindicator}"
    coreLibraryDesugaring "${thirdPartyApis.desugar_jdk_libs}"
//    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
//    annotationProcessor 'androidx.annotation:annotation:1.7.0'
//    api "androidx.lifecycle:lifecycle-extensions:2.2.0"
//    api project(':imagepicker')
//    implementation 'io.github.lucksiege:pictureselector:v3.11.2'
//    implementation 'io.github.lucksiege:compress:v3.11.2'
//    implementation project(':momentclient')
//    implementation 'me.everything:overscroll-decor-android:1.0.4'
}


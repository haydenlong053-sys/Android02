plugins {
    id 'com.android.library'
    id 'com.google.protobuf'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.android'
}
apply from: '../config.gradle'
apply plugin: 'realm-android'

android {
    namespace 'com.freddy.im'
    compileSdkVersion libsinfo.compileSdk

    defaultConfig {
        minSdk libsinfo.minSdk
//        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation 'com.github.getActivity:EasyHttp:13.5'
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    implementation "com.google.code.gson:gson:2.10.1"
//    testImplementation rootProject.ext.dependencies.test_junit
//    androidTestImplementation rootProject.ext.dependencies.test_runner
//    androidTestImplementation rootProject.ext.dependencies.test_espresso
//    androidTestImplementation rootProject.ext.dependencies.test_androidx_junit
    api libs.protobuf.java
    implementation files('libs/netty-tcp-4.1.33-1.0.jar')
}

protobuf {
    protoc {
        // protobuf 插件要求 artifact 为 "group:name:version" 字符串，不能直接传 version catalog 对象
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.verson.get()}"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
//    id 'com.google.gms.google-services'
//    id 'com.github.ben-manes.versions' version '0.53.0'
}
apply from: '../config.gradle'


static def releaseTime() {
    return new Date().format("MMdd_HHmm", TimeZone.getTimeZone("GMT+8:00"))
}

android {
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    signingConfigs {
        release {
            storeFile file(libsinfo.storeFile)
            storePassword libsinfo.storePassword
            keyAlias libsinfo.keyAlias
            keyPassword libsinfo.storePassword
            v2SigningEnabled true
        }

        debug {
            storeFile file(libsinfo.storeFile)
            storePassword libsinfo.storePassword
            keyAlias libsinfo.keyAlias
            keyPassword libsinfo.storePassword
            v2SigningEnabled true
        }
    }


    namespace 'com.cboda.intelligent'
    compileSdkVersion libsinfo.compileSdk
    buildToolsVersion libsinfo.buildToolsVersion
    defaultConfig {
        applicationId libsinfo.applicationId
        targetSdk libsinfo.compileSdk
        minSdk libsinfo.minSdk
        versionCode libsinfo.versionCode
        versionName libsinfo.versionName

        ndk {
            //选择要添加的对应 cpu 类型的 .so 库。
//            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a'
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'//, 'armeabi-v7a'
//            abiFilters  'armeabi-v7a', 'arm64-v8a','x86', 'x86_64'
            // 还可以添加 'x86', 'x86_64', 'mips', 'mips64'
        }


//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        // 启用核心库去糖
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.4"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    useLibrary 'org.apache.http.legacy'
    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def fileName = "MyApp_" + "${variant.buildType.name}_" + defaultConfig.versionName + "_" + releaseTime() + ".apk"
            outputFileName = fileName
        }
    }

    // 如果提示 libc++_shared.so 冲突，打开下面的注释
    packagingOptions {

        exclude 'lib/arm64-v8a/libaosl.so'
        exclude 'lib/armeabi-v7a/libaosl.so'
        exclude 'lib/x86/libaosl.so'
        exclude 'lib/x86_64/libaosl.so'

        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst "lib/arm64-v8a/libaosl.so"
        pickFirst "lib/armeabi-v7a/libaosl.so"
        pickFirst "lib/x86/libaosl.so"
        pickFirst "lib/x86_64/libaosl.so"
        exclude 'assets/infowindow_bg.9.png'
        exclude 'lib/arm64-v8a/librtmp-jni.so'
    }
}

configurations.all {
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-media-compat'
    exclude group: 'com.android.support', module: 'support-v4'
    exclude group: 'com.android.support', module: 'support-annotations'
    exclude group: 'com.android.support', module: 'support-vector-drawable'
    exclude group: 'com.android.support', module: 'animated-vector-drawable'
    exclude group: 'com.android.support', module: 'versionedparcelable'
    exclude group: 'com.android.support', module: 'coordinatorlayout'
    exclude group: 'com.android.support', module: 'design'
}


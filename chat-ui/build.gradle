apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 23
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
//                includeCompileClasspath true
            }
        }

//        ndk {
//            abiFilters "armeabi-v7a", 'x86', 'x86_64' // ，'armeabi', 'arm64-v8a', 'x86', 'x86_64'
//        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main {
            res.srcDirs += ['src/main/res-av']

            // moment start
//            java.srcDirs += ['../../android-momentkit/src/main/java']
//            res.srcDirs += ['../../android-momentkit/src/main/res-moment']
            // moment end
        }
    }
    productFlavors {
    }
    namespace 'com.cboda.chatui'
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
//    repositories {
//        flatDir {
//            dirs 'libs'
//        }
//    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    api files('libs/broad_chat_vengin.aar')
    api files('libs/broad_chat_pttclient.aar')
    api files('libs/broad_chat_libwebrtc.aar')
//    api files('libs/broad_chat_client.aar')
//    api(name: 'avenginekit', ext: 'aar')
//    api(name: 'pttclient', ext: 'aar')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    api project(':chat-client')

    // wfc kit start
//    implementation project(':webrtc')

    //    api project(':avenginekit')
//    api project(':pttclient')
//    api project(':badgeview')
    api project(':baselibrary')

//    api project(':emojilibrary')
    api project(':chat-emoji')
//    api files('libs/broad_chat_emoji.aar')
//    api project(':imagepicker')

    implementation 'com.lqr.adapter:library:1.0.2'
    implementation 'com.jaeger.statusbaruitl:library:1.3.5'

    api 'androidx.appcompat:appcompat:1.7.0-alpha03'
    api 'com.google.android.material:material:1.10.0'
    implementation 'cjt.library.wheel:camera:1.1.9'
    api 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    annotationProcessor 'androidx.annotation:annotation:1.7.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    api 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'com.google.code.gson:gson:2.9.0'

    api "androidx.lifecycle:lifecycle-extensions:2.2.0"
    api 'com.king.zxing:zxing-lite:1.1.1'
    api 'cn.aigestudio.wheelpicker:WheelPicker:1.1.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    api 'com.google.android:flexbox:2.0.1'

    implementation 'io.kvh:amr:1.1.1'
    implementation 'com.tbuonomo.andrui:viewpagerdotsindicator:2.1.2'
    implementation 'org.greenrobot:eventbus:3.3.1'

//    implementation 'io.github.lucksiege:pictureselector:v3.11.2'
//    implementation 'io.github.lucksiege:compress:v3.11.2'
    implementation 'io.github.lucksiege:ucrop:v3.11.2'

    // moment start

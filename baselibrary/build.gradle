plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.cboda.baselibrary'
    compileSdk 36

    defaultConfig {
        minSdk 29

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    def room_version = "2.6.1"
//    implementation 'androidx.core:core-ktx:1.7.0'
//    implementation 'androidx.appcompat:appcompat:1.5.1'
//    implementation 'com.google.android.material:material:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    //可定义大小
    api 'com.github.hackware1993:MagicIndicator:1.7.0'
    //字母检索
    api 'com.github.mcxtzhang:SuspensionIndexBar:V1.0.0'
    api 'io.github.razerdp:BasePopup:3.2.1'
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    api 'com.squareup.retrofit2:converter-gson:2.9.0'
//    api 'io.coil-kt:coil:2.1.0'
    api("io.coil-kt:coil-compose:2.7.0")
    api 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    api 'com.airbnb.android:lottie:6.5.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

//    api "androidx.room:room-runtime:$room_version"
//    kapt "androidx.room:room-compiler:$room_version"
    api "androidx.room:room-ktx:$room_version"
    implementation "com.tencent.bugly:crashreport:4.1.9.3"
    implementation "com.tencent:mmkv:2.3.0"

    api "com.github.getActivity:ShapeView:8.5"
    api "com.blankj:utilcodex:1.31.1"
//    api project(':selector-piclib')
    api 'com.github.bumptech.glide:glide:5.0.5'
//    api 'top.zibin:Luban:1.1.8'
    api 'io.github.lucksiege:compress:v3.0.9'
    api 'io.github.dinuscxj:circleprogressbar:1.4.1'
    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.10'
    api 'io.github.lucksiege:ucrop:v3.11.2'
//    api 'com.droidninja:filepicker:2.2.5'
//    api project(':filepicker')
//    api project(':videocompressor')
}